<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="circuit_title circuit_desc">
<title id="circuit_title">2段の交流結合オペアンプ回路</title>
<desc id="circuit_desc">入力viからC3とR5を通して第1段の反転入力へ接続。第1段の帰還はR2とC2の並列。非反転入力は5 VからR10と接地側R9でバイアス。第1段出力からC4とR6を通して第2段の反転入力へ接続。帰還はR1とC1の並列。非反転入力は5 VからR8と接地側R7でバイアス。第2段出力はvo。</desc>
<style>
  .wire, .symbol { fill: none; stroke: #171717; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: #171717; }
  .label { fill: #171717; font-family: 'Times New Roman', serif; font-size: 38px; font-style: italic; text-anchor: middle; }
  .sub { font-size: 24px; }
  .sign { fill: #171717; font-family: serif; font-size: 36px; text-anchor: middle; }
  .voltage { fill: #171717; font-size: 28px; text-anchor: middle; }
  .voltage, .value { font-family: "Times New Roman", serif; font-style: normal; }
  .value { fill: #171717; font-size: 22px; text-anchor: middle; }
</style>
<defs>
  <g id="resistor_h" class="symbol"><path d="M0 0 L10 0 L18 -15 L32 15 L46 -15 L60 15 L74 -15 L88 15 L96 0 L106 0"/></g>
  <g id="capacitor_h" class="symbol"><path d="M0 0 H24 M24 -18 V18 M38 -18 V18 M38 0 H62"/></g>
  <g id="ground" class="symbol"><path d="M0 0 V18 M-22 18 H22 M-16 18 L-24 31 M0 18 L-8 31 M16 18 L8 31"/></g>
</defs>
