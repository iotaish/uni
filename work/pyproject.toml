[tool.uv.workspace]
members = [
    "tutorial",
    "test",
    "workB",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
