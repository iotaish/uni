[project]
name = "workc"
version = "0.1.0"
description = "ワークC: データ取得・分析（LEDマトリクス表示、Webサーバ通信、時系列平滑化）"
requires-python = ">=3.14"
dependencies = [
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.2.0",
    "pandas>=3.0.6",
    "pyserial>=3.5",
    "requests>=2.32.3",
    "setuptools>=84.0.0",
]

[dependency-groups]
dev = [
    "marimo>=0.25.0",
]
