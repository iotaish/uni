<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 120 3820 2560" width="100%" height="100%">
  <defs>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#E040FB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#00E676"/>
    </marker>
  </defs>
  <image href="../raw/赤高々.JPG" width="4000" height="3000"/>
  <g id="annotations">
  <!-- 周期測定グループ (2.4 div) -->
  <g id="meas-period" class="measurement">
    <g transform="translate(1614.0, 1100.0) rotate(90)">
      <line x1="-350.0" y1="0.0" x2="350.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <g transform="translate(2230.0, 1100.0) rotate(90)">
      <line x1="-350.0" y1="0.0" x2="350.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <line x1="1614.0" y1="850.0" x2="2230.0" y2="850.0" stroke="#E040FB" stroke-width="5" marker-start="url(#arrow-magenta)" marker-end="url(#arrow-magenta)"/>
    <g transform="translate(1867.0, 780.0)">
      <rect width="110" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#E040FB" stroke-width="2"/>
      <text x="55.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">2.4</text>
    </g>
  </g>
  <!-- リップル振幅測定グループ (1.3 div) -->
  <g id="meas-amplitude-ripple" class="measurement">
    <g transform="translate(2450.0, 1120.0) rotate(0)">
      <line x1="-300.0" y1="0.0" x2="300.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <g transform="translate(2450.0, 1400.0) rotate(0)">
      <line x1="-300.0" y1="0.0" x2="300.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <line x1="2450.0" y1="1400.0" x2="2450.0" y2="1120.0" stroke="#00E676" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <g transform="translate(2485.0, 1230.0)">
      <rect width="110" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E676" stroke-width="2"/>
      <text x="55.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">1.3</text>
    </g>
  </g>
  </g>
</svg>
