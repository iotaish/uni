<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4000 3000" width="100%" height="100%">
  <defs>
    <marker id="arrow-annotation" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"
      orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#00E676" />
    </marker>
    <style>
      .component-label {
        font-family: sans-serif;
        font-size: 36px;
        font-weight: bold;
        fill: #FFFFFF;
      }

      .component-value {
        font-family: sans-serif;
        font-size: 28px;
        fill: #A5D6A7;
      }

      .leader-line {
        stroke: #00E676;
        stroke-width: 4;
        stroke-dasharray: 8, 6;
      }
    </style>
  </defs>
  <image href="../raw/回路.JPG" width="4000" height="3000" />
  <g id="annotations">
    <!-- 素子位置の検出および素子値アノテーションを配置する領域 -->
    <!--
      対象素子一覧（01_work_A.tex 表3.1 / 回路図準拠）:
      - R1: 100 kΩ (後段帰還抵抗)
      - R2: 1 MΩ (初段帰還抵抗)
      - R3: 330 Ω (フォトリフレクタ赤外LED電流制限抵抗)
      - R4: 3.3 kΩ (フォトリフレクタ負荷抵抗)
      - R5: 33 kΩ (初段入力抵抗)
      - R6: 33 kΩ (後段入力抵抗)
      - R7: 33 kΩ (後段非反転バイアス分圧抵抗・接地側)
      - R8: 100 kΩ (後段非反転バイアス分圧抵抗・5V側)
      - R9: 33 kΩ (初段非反転バイアス分圧抵抗・接地側)
      - R10: 100 kΩ (初段非反転バイアス分圧抵抗・5V側)
      - C1: 0.1 µF (後段帰還並列コンデンサ)
      - C2: 0.01 µF (初段帰還並列コンデンサ)
      - C3: 10 µF (初段入力結合コンデンサ)
      - C4: 10 µF (段間結合コンデンサ)
      - IC1: LM358N (オペアンプ)
      - TR1: LBR-127HLD (フォトリフレクタ)
    -->
    <g id="circuit-components" class="components">
      <!-- 各素子のバウンディングボックス・引出線・素子値バッジを注入予定 -->
    </g>
  </g>
</svg>
