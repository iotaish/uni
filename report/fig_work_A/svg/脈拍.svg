<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 120 3820 2560" width="100%" height="100%">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#00E5FF"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FF9100"/>
    </marker>
  </defs>
  <image href="../raw/脈拍.JPG" width="4000" height="3000"/>
  <g id="annotations">
    <!-- 最長周期 T1: 2.4div (CH2 脈波ピーク間) -->
    <line x1="1824.0" y1="360.0" x2="1824.0" y2="2090.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="2453.0" y1="360.0" x2="2453.0" y2="2090.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="1824.0" y1="620.0" x2="2453.0" y2="620.0" stroke="#00E5FF" stroke-width="5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(2070.0, 550.0)">
      <rect width="136" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E5FF" stroke-width="2"/>
      <text x="68.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">2.4</text>
    </g>

    <!-- 次長周期 T2: 2.3div (CH2 脈波周期区間) -->
    <line x1="3056.0" y1="360.0" x2="3056.0" y2="2090.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="2453.0" y1="620.0" x2="3056.0" y2="620.0" stroke="#00E5FF" stroke-width="5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(2686.0, 550.0)">
      <rect width="136" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E5FF" stroke-width="2"/>
      <text x="68.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">2.3</text>
    </g>

    <!-- 入出力時間差: 0.2div (CH1入力ピーク X=1763 と CH2出力ピーク X=1824 の間隔) -->
    <line x1="1763.0" y1="1000.0" x2="1763.0" y2="1600.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="1824.0" y1="1000.0" x2="1824.0" y2="1600.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="1763.0" y1="1350.0" x2="1824.0" y2="1350.0" stroke="#00E5FF" stroke-width="5" marker-start="url(#arrow-cyan)" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(1725.0, 1280.0)">
      <rect width="136" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E5FF" stroke-width="2"/>
      <text x="68.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">0.2</text>
    </g>

    <!-- CH2出力電圧振幅: 2.1div (収縮期山頂 Y=1115 と 拡張期谷底 Y=1568 の間隔) -->
    <line x1="480.0" y1="1115.0" x2="3180.0" y2="1115.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="480.0" y1="1568.0" x2="3180.0" y2="1568.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    <line x1="2980.0" y1="1568.0" x2="2980.0" y2="1115.0" stroke="#FF9100" stroke-width="5" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
    <g transform="translate(3015.0, 1311.5)">
      <rect width="136" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#FF9100" stroke-width="2"/>
      <text x="68.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">2.1</text>
    </g>
  </g>
</svg>
