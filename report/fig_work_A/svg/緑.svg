    <line x1="2920.0" y1="2050.0" x2="2920.0" y2="440.0" stroke="#00E676" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <g transform="translate(2955.0, 1215.0)">
