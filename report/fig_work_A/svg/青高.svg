<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 120 3820 2560" width="100%" height="100%">
  <defs>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#E040FB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#00E676"/>
    </marker>
  </defs>
  <image href="../raw/青高.JPG" width="4000" height="3000"/>
  <g id="annotations">
  <!-- 周期測定グループ (0.8 div) -->
  <g id="meas-period" class="measurement">
    <g transform="translate(2220.0, 1000.0) rotate(90)">
      <line x1="-350.0" y1="0.0" x2="350.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <g transform="translate(2430.0, 1000.0) rotate(90)">
      <line x1="-350.0" y1="0.0" x2="350.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <line x1="2220.0" y1="750.0" x2="2430.0" y2="750.0" stroke="#E040FB" stroke-width="5" marker-start="url(#arrow-magenta)" marker-end="url(#arrow-magenta)"/>
    <g transform="translate(2270.0, 680.0)">
      <rect width="110" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#E040FB" stroke-width="2"/>
      <text x="55.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">0.8</text>
    </g>
  </g>
  <!-- 黄色波形 振幅測定グループ (1.6 div) -->
  <g id="meas-amplitude-ch1" class="measurement">
    <g transform="translate(2650.0, 888.0) rotate(0)">
      <line x1="-250.0" y1="0.0" x2="250.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <g transform="translate(2650.0, 1225.0) rotate(0)">
      <line x1="-250.0" y1="0.0" x2="250.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <line x1="2650.0" y1="1225.0" x2="2650.0" y2="888.0" stroke="#00E676" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <g transform="translate(2685.0, 1026.5)">
      <rect width="110" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E676" stroke-width="2"/>
      <text x="55.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">1.6</text>
    </g>
  </g>
  <!-- シアン波形 振幅測定グループ (4.7 div) -->
  <g id="meas-amplitude-ch2" class="measurement">
    <g transform="translate(2950.0, 747.0) rotate(0)">
      <line x1="-250.0" y1="0.0" x2="250.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <g transform="translate(2950.0, 1760.0) rotate(0)">
      <line x1="-250.0" y1="0.0" x2="250.0" y2="0.0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14,10" opacity="0.8"/>
    </g>
    <line x1="2950.0" y1="1760.0" x2="2950.0" y2="747.0" stroke="#00E676" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <g transform="translate(2985.0, 1223.5)">
      <rect width="110" height="60" rx="10" ry="10" fill="#0A0D12" fill-opacity="0.88" stroke="#00E676" stroke-width="2"/>
      <text x="55.0" y="44.0" fill="#FFFFFF" font-family="sans-serif" font-size="42" font-weight="bold" text-anchor="middle">4.7</text>
    </g>
  </g>
  </g>
</svg>
